name: Build WSL rootfs

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # weekly rebuild so apt/npm packages and repo checkouts stay fresh
    - cron: "0 4 * * 1"

permissions:
  contents: write
  packages: write

env:
  ASSET: pizza-sim-rootfs.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR requires an all-lowercase repository name, but github.repository
      # keeps the original casing (BPMspaceUG/...). Expressions have no
      # toLower(), so normalise it here.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # load and push cannot be combined in one buildx call, so build into the
      # local daemon first - we need the image there anyway for docker export.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image to GHCR
        run: |
          docker tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Export flat rootfs for WSL
        run: |
          cid=$(docker create "$IMAGE:latest")
          docker export "$cid" | gzip -9 > "$ASSET"
          docker rm "$cid"
          ls -lh "$ASSET"

      - name: Fail if asset exceeds the 2 GB release limit
        run: |
          size=$(stat -c%s "$ASSET")
          echo "rootfs size: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt 2000000000 ]; then
            echo "::error::rootfs exceeds the 2 GB GitHub release asset limit"
            exit 1
          fi

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootfs-latest
          name: WSL rootfs (latest)
          body: |
            Prebuilt WSL rootfs, commit `${{ github.sha }}`

            Install on Windows:

                create_debian user:password
          files: |
            ${{ env.ASSET }}
            scripts/create_debian.ps1
          make_latest: true
